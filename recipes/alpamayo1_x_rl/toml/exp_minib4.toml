#
# Direction-1 experiment: policy mini_batch=4 (48 samples -> 12 forward passes/step).

redis = "12800"

[train]
resume = false
epoch = 6
output_dir = "/raid/charlie/cc_run/exp_minib4"
epsilon = 1e-6
optm_name = "AdamW"
optm_lr = 2e-6
optm_impl = "fused"
optm_weight_decay = 0.01
optm_betas = [0.9, 0.999]
optm_warmup_steps = 0
optm_grad_norm_clip = 1.0
async_tp_enabled = false
compile = false
param_dtype = "bfloat16"
fsdp_reduce_dtype = "float32"
fsdp_offload = false
fsdp_reshard_after_forward = "default"
train_batch_per_replica = 48
sync_weight_interval = 2
validation_step = 50
validation_batch_per_replica = 4
non_text = true

[validation]
enable = false
freq = 50
batch_size = 4
temperature = 0.6
n_generation = 6

[rollout]
backend = "reasoning_vla_vllm_rollout"
gpu_memory_utilization = 0.55
enable_chunked_prefill = false
n_generation = 12
batch_size = 2
quantization = "none"
seed = 42

[rollout.sampling_config]
temperature = 0.6
top_p = 0.98
repetition_penalty = 1

[policy]
model_name_or_path = "/raid/charlie/cc_run/alpamayo_1_5_converted"
model_max_length = 4096
model_gradient_checkpointing = true

[logging]
logger = ['console']
project_name = "Alpamayo_RL"
experiment_name = "ReasoningVLA_Post_Training_minib4"

[train.train_policy]
type = "grpo"
trainer_type = "reasoning_vla_grpo"
dataloader_shuffle = false
dataset.split = "train"
data_dispatch_as_rank_in_mesh = false
temperature = 1.0
epsilon_low = 0.2
epsilon_high = 0.28
lower_bound_ratio = 10.0
kl_beta = 0.0
mu_iterations = 1
mini_batch = 4
min_filter_prefix_tokens = 1
allowed_outdated_steps = 50

[train.ckpt]
enable_checkpoint = true
save_freq = 50
save_mode = "async"
max_keep = 10

[rollout.parallelism]
n_init_replicas = 1
tp_size = 1
cp_size = 1
dp_shard_size = 1
pp_size = 1
dp_replicate_size = 1

[policy.parallelism]
n_init_replicas = 1
tp_size = 1
cp_size = 1
dp_shard_size = 6
pp_size = 1
dp_replicate_size = 1

[custom.alpamayo]
idx_rng_enable = false
idx_rng_seed = 1234
idx_rng_debug = false

[custom.alpamayo.reward]
traj_l2_weight = 0.4
comfort_weight = 0.1

[custom.alpamayo.prefetch]
capacity = 48
num_workers = 5
log_level = "info"
log_request_details = false
